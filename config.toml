# Halo settings
#
# The game writes this file with the defaults when it is missing: delete
# it to go back to them. Each setting can also be set for one run with
# the environment variable named with it, which wins over this file.

[display]

# Start fullscreen, drawing at the display's resolution and shape; false
# starts in a window, which draws the Xbox's 640x480. F11 switches.
# (for one run: HALO_FULLSCREEN=<value>)
fullscreen = true

# The window's size as a multiple of 640x480 (it can be resized).
# (for one run: HALO_WINDOW_SCALE=<value>)
window_scale = 2

# Wait for the display between frames; false draws as fast as possible.
# (for one run: HALO_NO_VSYNC=1 makes it false)
vsync = true

# Draw a frame for every display refresh, blending between the game's 30
# ticks a second; false keeps the original 30 frames a second.
# (for one run: HALO_INTERPOLATION=<value>)
interpolation = true

# Rendered frames per second: 1 to 1200, or 0 for unlimited. VSync can
# still impose the display refresh rate. Changed immediately by Settings.
# (for one run: HALO_FRAME_RATE_LIMIT=<value>)
frame_rate_limit = 0

# Rendering resolution: 144, 240, 480, 1080, 1440, 2160 (4K), or 0 for
# the screen's own size. Changed immediately by the Settings menu.
# (for one run: HALO_RENDER_HEIGHT=<value>)
render_height = 0

# Custom Forge texture resolution: 1 for the original lossless assets or 2
# for the browser-upscaled 2x assets. Changed immediately by Settings.
# (for one run: HALO_TEXTURE_SCALE=<value>)
texture_scale = 1

# With render_height 0, the rendering resolution as a percent of the
# display's, 25 to 200: below 100 is faster, above 100 is sharper.
# (for one run: HALO_RENDER_SCALE=<value>)
render_scale = 100

# Horizontal field of view of the gameplay cameras in degrees on a 4:3
# screen, 60 to 120 (70 is the original). Zoom keeps its ratio.
# (for one run: HALO_FIELD_OF_VIEW=<value>)
field_of_view = 70

# Brightness (gamma) of the whole picture in percent, 50 to 150.
# (for one run: HALO_BRIGHTNESS=<value>)
brightness = 100

# Camera motion blur strength in percent, 0 (off) to 100. The HUD and
# your own weapon stay sharp.
# (for one run: HALO_MOTION_BLUR=<value>)
motion_blur = 0

# Anti-aliasing of the 3D view: 0 off, 1 FXAA. For more, raise
# render_scale above 100 (supersampling).
# (for one run: HALO_ANTI_ALIASING=<value>)
anti_aliasing = 0

# Anisotropic texture filtering: 1 (off), 2, 4, 8 or 16.
# (for one run: HALO_ANISOTROPY=<value>)
anisotropy = 1

# Draw lens flares around bright lights.
# (for one run: HALO_LENS_FLARES=<value>)
lens_flares = true

# Draw detail objects: the grass, pebbles and small plants on the ground.
# (for one run: HALO_DETAIL_OBJECTS=<value>)
detail_objects = true

[audio]

# Play sound.
# (for one run: HALO_NO_AUDIO=1 makes it false)
enabled = true

# The volume of everything, 0.0 to 1.0.
# (for one run: HALO_VOLUME=<value>)
volume = 1.0

# The volume of the music during play, in percent (0 to 100).
# (for one run: HALO_MUSIC_VOLUME=<value>)
music_volume = 100

# The volume of the main menu's music, in percent.
# (for one run: HALO_MENU_MUSIC_VOLUME=<value>)
menu_music_volume = 100

# The volume of weapons, vehicles, impacts, footsteps and the menus'
# sounds, in percent.
# (for one run: HALO_EFFECTS_VOLUME=<value>)
effects_volume = 100

# The volume of ambient sound: wind, water, machinery, computers, in
# percent.
# (for one run: HALO_AMBIENT_VOLUME=<value>)
ambient_volume = 100

# The volume of dialogue: Cortana, the cutscenes and the characters'
# chatter, in percent.
# (for one run: HALO_DIALOGUE_VOLUME=<value>)
dialogue_volume = 100

# Silence the game while its window is not the one in front.
# (for one run: HALO_MUTE_IN_BACKGROUND=<value>)
mute_in_background = false

[input]

# How far the view turns for the mouse's movement.
# (for one run: HALO_MOUSE_SENSITIVITY=<value>)
mouse_sensitivity = 1.0

# Moving the mouse forward looks down.
# (for one run: HALO_MOUSE_INVERT=1 makes it true)
invert_mouse = false

# Keep keyboard/mouse on Player 1 and assign the first physical gamepad to
# Player 2. This permits keyboard-and-gamepad split screen.
# (for one run: HALO_SEPARATE_GAMEPAD=<value>)
separate_gamepad = false

[game]

# The language the game asks the Xbox for: "ja", "de", "fr", "es" or "it";
# empty for English. The game data decides what is translated.
# (for one run: HALO_LANGUAGE=<value>)
language = ""

# Allow eligible one-handed weapons picked up with the action button to pair.
# The left trigger fires the left gun; grenades, melee and zoom wait until it is stowed.
# (for one run: HALO_DUAL_WIELDING=<value>)
dual_wielding = true

[map]

# Mirror the playable world and horizontal controls while keeping HUD text
# readable: 0 never, 1 random once per level load, 2 always.
# (for one run: HALO_MIRROR_LEVEL=<value>)
mirror_level = 0

[paths]

# The folder holding the game data's maps folder; empty looks in the
# working directory and its assets folder. Windows paths are easiest in
# single quotes: 'C:\Games\Halo'.
# (for one run: HALO_DATA_ROOT=<value>)
data = "assets"

# Where saved games and profiles go; empty for the usual place
# (~/.local/share/halo-linux, or %APPDATA%\halo on Windows).
# (for one run: HALO_SAVE_ROOT=<value>)
saves = ""

[network]

# This machine's IPv4 address for system link, for a machine on several
# networks; empty chooses one.
# (for one run: HALO_NET_ADDRESS=<value>)
address = ""

# Comma-separated IPv4 addresses system link sends its announcements to
# instead of the local network's broadcast address (for VPNs); empty for
# the local network.
# (for one run: HALO_NET_BROADCAST=<value>)
broadcast = ""

# "distributed" (work in progress, port/linux/NETCODE.md) predicts each
# player's own moves and lets the host decide the rest; "lockstep" plays
# system link as the Xbox game did. The host's is played: a machine that
# joins a game plays its host's.
# (for one run: HALO_NETCODE=<value>)
netcode = "distributed"

# Internet play: hosting makes an invite link (logged, and put on the
# clipboard) that lets whoever has it join over the internet; opening a
# link (or copying one before switching to the game) joins. Only people
# with the invite can join. Off keeps system link to the local network.
# (for one run: HALO_NET_ONLINE=<value>)
online = true

# Join the game of an invite link found on the clipboard when the game
# comes to the front.
# (for one run: HALO_NET_JOIN_FROM_CLIPBOARD=<value>)
join_from_clipboard = true

# The UDP port internet play uses; 0 picks one. A fixed one can be
# forwarded on the router, for networks whose NAT stops connections.
# (for one run: HALO_NET_TUNNEL_PORT=<value>)
tunnel_port = 0

# Let internet play ask the router (UPnP) to forward its port, for
# networks whose NAT stops connections: when a player joins this
# machine's game, and when joining a game takes too long. False never
# asks.
# (for one run: HALO_NET_ALLOW_UPNP=<value>)
allow_upnp = true

# Public MQTT brokers through which the machines of an invite find each
# other (its messages are encrypted); comma-separated host:port.
# (for one run: HALO_NET_BROKERS=<value>)
signalling_brokers = "broker.emqx.io:1883,broker.hivemq.com:1883,test.mosquitto.org:1883"

# Public STUN servers that tell this machine its internet address;
# comma-separated host:port.
# (for one run: HALO_NET_STUN=<value>)
stun_servers = "stun.l.google.com:19302,stun.cloudflare.com:3478"

# Host late joins for Standard: 0 lobby only, 1 anytime.
# (for one run: HALO_JOIN_STANDARD=<value>)
join_standard = 1

# Host late joins for Forge: 0 lobby only, 1 anytime.
# (for one run: HALO_JOIN_FORGE=<value>)
join_forge = 1

# Host late joins for Theater: 0 lobby only, 1 anytime.
# (for one run: HALO_JOIN_THEATER=<value>)
join_theater = 1

# Host late joins for Machinima: 0 lobby only, 1 anytime.
# (for one run: HALO_JOIN_MACHINIMA=<value>)
join_machinima = 1

# Host late joins for all Firefight presets: 0 lobby only, 1 anytime, 2 between waves.
# (for one run: HALO_JOIN_FIREFIGHT=<value>)
join_firefight = 1

# Host late joins for Infection: 0 lobby only, 1 anytime.
# (for one run: HALO_JOIN_INFECTION=<value>)
join_infection = 1

# Password required before new peers enter your lobby (up to 63 UTF-8 bytes). Empty allows public joins.
# (for one run: HALO_HOST_PASSWORD=<value>)
host_password = ""

# Password for the next host you join. Empty is valid for public sessions.
# (for one run: HALO_JOIN_PASSWORD=<value>)
join_password = ""

[discord]

# The Discord application internet play invites go through while the
# Discord desktop client runs; empty for none.
# (for one run: HALO_DISCORD_APPLICATION=<value>)
application_id = "1553978809840050229"

[update]

# Look for a new version when the game starts, and offer to update to it;
# false never looks (the game's "Do not ask again" writes false here).
# (for one run: HALO_UPDATE_AUTO=<value>)
auto = true

[debug]

# Automated system link sessions for testing (port/linux/game/network_test.c):
# "host:<map>" hosts a game on that map, "join" joins the first game found;
# empty for none.
# (for one run: HALO_NETWORK_TEST=<value>)
network_test = ""

# Seconds after hosting that an automated test game starts.
# (for one run: HALO_NETWORK_TEST_START=<value>)
network_test_start = 15.0

# Every this many seconds an automated test host kills its last player; 0 never.
# (for one run: HALO_NETWORK_TEST_KILL=<value>)
network_test_kill = 0.0

# Every this many seconds each automated test player hits the next with
# their weapon; 0 never.
# (for one run: HALO_NETWORK_TEST_SHOOT=<value>)
network_test_shoot = 0.0

# This many seconds into an automated test game the host seats its last
# player as a vehicle's driver (and out 15 seconds on); 0 never.
# (for one run: HALO_NETWORK_TEST_VEHICLE=<value>)
network_test_vehicle = 0.0

# This many seconds into an automated test game the host stands its last
# player on a weapon, which a joining player then picks up; 0 never.
# (for one run: HALO_NETWORK_TEST_PICKUP=<value>)
network_test_pickup = 0.0

# Milliseconds everything received is held back (a round trip between two
# machines of twice it), to test the netcode as over the internet; 0 none.
# (for one run: HALO_NETWORK_LATENCY=<value>)
network_latency = 0.0

# Percent of datagrams received that are dropped, for the same; 0 none.
# (for one run: HALO_NETWORK_LOSS=<value>)
network_loss = 0.0

# "bot:<seed>" plays controller 1 with a scripted pattern (automated
# network tests); empty for none.
# (for one run: HALO_TEST_INPUT=<value>)
test_input = ""

# The answer to the new version question, for automated tests: "yes",
# "no" or "never" (do not ask again, confirmed); empty asks.
# (for one run: HALO_UPDATE_ANSWER=<value>)
update_answer = ""

# Quit this many seconds after the window opens; 0 never.
# (for one run: HALO_EXIT_AFTER=<value>)
exit_after = 0.0

# Keep the window hidden (and never fullscreen).
# (for one run: HALO_HIDDEN_WINDOW=1 makes it true)
hidden_window = false

# Run without a window, drawing nothing.
# (for one run: HALO_NULL_RENDERER=1 makes it true)
null_renderer = false

# Report OpenGL errors in the log.
# (for one run: HALO_GL_DEBUG=1 makes it true)
gl_debug = false

# Log the renderer's draw counts once a second.
# (for one run: HALO_GPU_STATS=1 makes it true)
gpu_stats = false

# Log every draw of this frame; -1 none.
# (for one run: HALO_GPU_TRACE=<value>)
gpu_trace_frame = -1

# With gpu_trace_frame, also the vertex shader constants.
# (for one run: HALO_GPU_TRACE_CONSTANTS=1 makes it true)
gpu_trace_constants = false

# Comma-separated ids of vertex shaders not to draw with.
# (for one run: HALO_GPU_SKIP_VS=<value>)
gpu_skip_vertex_shaders = ""

# A folder to write the generated GLSL to; empty none.
# (for one run: HALO_GPU_DUMP_SHADERS=<value>)
gpu_dump_shaders = ""

# A GLSL expression every pixel shader shows instead of its result.
# (for one run: HALO_GPU_DEBUG_EXPR=<value>)
gpu_debug_expression = ""

# Pixel shaders show their first texture.
# (for one run: HALO_GPU_DEBUG_T0=1 makes it true)
gpu_debug_texture0 = false

# Pixel shaders show their vertex colour.
# (for one run: HALO_GPU_DEBUG_FLAT=1 makes it true)
gpu_debug_flat = false

# A folder to save frames to (with screenshot_every); empty none.
# (for one run: HALO_SCREENSHOT_DIR=<value>)
screenshot_directory = ""

# Save every this many frames to screenshot_directory; 0 none.
# (for one run: HALO_SCREENSHOT_EVERY=<value>)
screenshot_every = 0

# A folder to write every texture to as it is uploaded; empty none.
# (for one run: HALO_TEXTURE_DUMP=<value>)
texture_dump_directory = ""

# Log texture uploads.
# (for one run: HALO_TEXTURE_LOG=1 makes it true)
texture_log = false

# Upload textures again every time they are used.
# (for one run: HALO_TEXTURE_NO_CACHE=1 makes it true)
texture_no_cache = false

# Network test only: place host bots facing the human at a measured distance; 0 disables.
# (for one run: HALO_BOT_ARENA=<value>)
bot_arena = 0

# Network test arena only: initial finite plasma grenade inventory (0..4).
# (for one run: HALO_BOT_TEST_GRENADES=<value>)
bot_grenades = 0

# Keep the local player alive with infinite ammunition during unattended
# campaign traversal. Only applies while debug.test_input is active.
# (for one run: HALO_TEST_INVINCIBLE=1 makes it true)
test_invincible = false

# Give the unattended local player one-shot damage during campaign traversal.
# Only applies while debug.test_input is active.
# (for one run: HALO_TEST_FAST_CLEAR=1 makes it true)
test_fast_clear = false

# Write sparse campaign level, checkpoint, BSP and player-state events to the log
# for unattended playthrough verification; false writes nothing.
# (for one run: HALO_CAMPAIGN_TELEMETRY=1 makes it true)
campaign_telemetry = false

# Revert an unattended solo campaign to its checkpoint when the local player
# remains dead. Only applies while debug.test_input is active.
# (for one run: HALO_TEST_AUTO_REVERT=1 makes it true)
test_auto_revert = false

# Parallel AI worker count: -1 chooses from CPU cores, 0 disables, maximum 3.
# (for one run: HALO_AI_WORKERS=<value>)
ai_workers = -1

# Log AI worker shutdown statistics for deterministic test verification.
# (for one run: HALO_AI_VERIFY=1 makes it true)
ai_verify = false

# Test-only arena starts as x,y,z,facing entries separated by semicolons.
# (for one run: HALO_ARENA_TEST_START=<value>)
arena_test_starts = ""

# Smoke test: reject every Nth universal reliable write; 0 disables.
# (for one run: HALO_UNIVERSAL_REJECT_EVERY=<value>)
universal_reject_every = 0

# Smoke test compatibility mismatch: version, build, content or gameplay.
# (for one run: HALO_UNIVERSAL_MISMATCH=<value>)
universal_mismatch = ""

# Smoke test: retain the old stale-valid bot navigation behavior.
# (for one run: HALO_NAV_BASELINE=1 makes it true)
navigation_baseline = false

# Smoke test: use the old bot driving controller.
# (for one run: HALO_DRIVING_BASELINE=1 makes it true)
driving_baseline = false

# Voice chat talks with a tone all the time instead of the microphone
# (automated tests); no microphone is opened.
# (for one run: HALO_VOICE_TEST_TONE=1 makes it true)
voice_test_tone = false

# With debug.network_test_vehicle, seat the player in the nearest vehicle's
# separate gunner seat (a Warthog's turret) instead of driving.
# (for one run: HALO_NETWORK_TEST_GUNNER=1 makes it true)
network_test_gunner = false

